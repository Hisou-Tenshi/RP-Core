[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rp-core"
version = "0.1.0"
description = "A character-neutral roleplay engine with a versioned private-adapter protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["jsonschema>=4.23,<5"]

[project.urls]
Source = "https://github.com/Hisou-Tenshi/RP-Core"
Documentation = "https://github.com/Hisou-Tenshi/RP-Core/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "setuptools>=77", "pyyaml>=6,<7"]

[project.scripts]
rp-core = "rp_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101", "S603", "S607"]
