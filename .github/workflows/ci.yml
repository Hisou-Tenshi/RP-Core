name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: git diff --exit-code -- web/lib/model-config.schema.json
      - run: node scripts/build_readme_diagrams.mjs --check
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest
      - run: node scripts/build_cloudflare.mjs --check
      - run: node --test tests/test_cloudflare*.mjs
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python scripts/export_schemas.py --check
      - run: uv run --no-sync python scripts/audit_public.py
      - run: uv run --no-sync python scripts/review_runtime_manifest.py --check
      - run: uv run --no-sync python -m build --no-isolation

  full-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --locked --extra dev --extra full
      - run: uv run --no-sync pytest tests/test_full_runtime.py -q
      - run: uv run --no-sync python scripts/run_compat_tests.py
      - run: uv run --no-sync rp-core full --task shadow
