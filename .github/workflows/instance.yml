name: Run private characters
on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: Registered public instance ID, or all
        required: true
        default: tenshi
        type: string
      event_id:
        description: Opaque event ID only; never put private content here
        required: false
        type: string
  repository_dispatch:
    types: [rp_event]
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  plan:
    if: ${{ vars.RP_LIVE_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.registry.outputs.matrix }}
      has_instances: ${{ steps.registry.outputs.has_instances }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Resolve registered and configured instances
        id: registry
        env:
          RP_DEFAULT_REPO_AVAILABLE: ${{ secrets.GH_REPO != '' }}
          RP_REPOSITORY_VARIABLES: ${{ toJSON(vars) }}
          RP_SELECTED_INSTANCE: ${{ inputs.instance_id || github.event.client_payload.instance_id || 'all' }}
        run: python3 scripts/resolve_instances.py --instance "$RP_SELECTED_INSTANCE" --github-output "$GITHUB_OUTPUT"
  run:
    env:
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      CLAUDE_CODEYU_BASE_API_KEY: ${{ secrets.CLAUDE_CODEYU_BASE_API_KEY }}
      CLAUDE_CODERPLAN_API_KEY: ${{ secrets.CLAUDE_CODERPLAN_API_KEY }}
      CLAUDE_CODEYU_MAX_API_KEY: ${{ secrets.CLAUDE_CODEYU_MAX_API_KEY }}
      CLAUDE_CODEYU_PRIME_API_KEY: ${{ secrets.CLAUDE_CODEYU_PRIME_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GAODE_API_KEY: ${{ secrets.GAODE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CODERPLAN_API_KEY: ${{ secrets.GEMINI_CODERPLAN_API_KEY }}
      GEMINI_CODEYU_API_KEY: ${{ secrets.GEMINI_CODEYU_API_KEY }}
      GH_REPO: ${{ secrets.GH_REPO }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GPT_API_KEY: ${{ secrets.GPT_API_KEY }}
      GPT_CODERPLAN_API_KEY: ${{ secrets.GPT_CODERPLAN_API_KEY }}
      GPT_CODEYU_API_KEY: ${{ secrets.GPT_CODEYU_API_KEY }}
      GROK_CODEYU_API_KEY: ${{ secrets.GROK_CODEYU_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      GROK_CODERPLAN_API_KEY: ${{ secrets.GROK_CODERPLAN_API_KEY }}
      CLAUDE_TOTOKENS_API_KEY: ${{ secrets.CLAUDE_TOTOKENS_API_KEY }}
      GEMINI_TOTOKENS_API_KEY: ${{ secrets.GEMINI_TOTOKENS_API_KEY }}
      GPT_TOTOKENS_API_KEY: ${{ secrets.GPT_TOTOKENS_API_KEY }}
      GROK_TOTOKENS_API_KEY: ${{ secrets.GROK_TOTOKENS_API_KEY }}
      KEEPALIVE_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
      MAGMAROUTER_API_KEY: ${{ secrets.MAGMAROUTER_API_KEY }}
      MASTER_KEY_SOURCE: ${{ secrets.MASTER_KEY_SOURCE }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      PERCEPTION_SCHEDULE_SYNC_SECRET: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_SECRET }}
      PERCEPTION_SCHEDULE_SYNC_URL: ${{ secrets.PERCEPTION_SCHEDULE_SYNC_URL }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      RP_FALLBACK_API_KEY: ${{ secrets.RP_FALLBACK_API_KEY }}
      RP_INSTANCE_TOKEN: ${{ secrets.RP_INSTANCE_TOKEN || secrets.TENSHI_BOT_ACTION_TOKEN || secrets.GH_TOKEN }}
      RP_MODEL_API_KEY: ${{ secrets.RP_MODEL_API_KEY }}
      RP_MODEL_BASE_URL: ${{ secrets.RP_MODEL_BASE_URL }}
      RP_TELEGRAM_TOKEN: ${{ secrets.RP_TELEGRAM_TOKEN }}
      TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TENSHI_BOT_ACTION_TOKEN: ${{ secrets.TENSHI_BOT_ACTION_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TIMEZONE_OFFSET: ${{ secrets.TIMEZONE_OFFSET }}
      RP_ALLOW_LIVE: '1'
      RP_INSTANCE_ID: ${{ matrix.id }}
      RP_DATA_REPOSITORY: ${{ vars[matrix.repository_variable] || secrets.GH_REPO }}
    needs: plan
    if: ${{ needs.plan.outputs.has_instances == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    concurrency:
      group: rp-character-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout shared public framework
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: framework
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked --extra full
        working-directory: framework
      - name: Verify data repository is private
        env:
          GH_TOKEN: ${{ secrets.RP_INSTANCE_TOKEN || secrets.TENSHI_BOT_ACTION_TOKEN || secrets.GH_TOKEN }}
          RP_DATA_REPOSITORY: ${{ vars[matrix.repository_variable] || secrets.GH_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$RP_DATA_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo '::error::Invalid data repository setting.'; exit 1
          fi
          if ! private="$(gh api "repos/$RP_DATA_REPOSITORY" --jq .private 2>/dev/null)"; then
            echo '::error::Cannot verify data repository visibility.'; exit 1
          fi
          if [ "$private" != true ]; then
            echo '::error::The data repository must be private.'; exit 1
          fi
      - name: Checkout character data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ vars[matrix.repository_variable] || secrets.GH_REPO }}
          token: ${{ secrets.RP_INSTANCE_TOKEN || secrets.TENSHI_BOT_ACTION_TOKEN || secrets.GH_TOKEN }}
          path: character-data
          ref: main
          fetch-depth: 1
          filter: blob:none
      - name: Run only public code against private data
        working-directory: framework
        env:
          RP_MODEL_API_KEY: ${{ secrets.RP_MODEL_API_KEY }}
          RP_MODEL_BASE_URL: ${{ secrets.RP_MODEL_BASE_URL }}
          RP_FALLBACK_API_KEY: ${{ secrets.RP_FALLBACK_API_KEY }}
          RP_TELEGRAM_TOKEN: ${{ secrets.RP_TELEGRAM_TOKEN }}
          RP_EVENT_ID: ${{ inputs.event_id || github.event.client_payload.event_id || '' }}
          RP_RUNTIME_CONFIG: ${{ matrix.runtime }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/character-data"
          args=(--config "$RP_RUNTIME_CONFIG" --data-root "$GITHUB_WORKSPACE/character-data" --require-remote-persistence)
          if [ -n "$RP_EVENT_ID" ]; then args+=(--event-id "$RP_EVENT_ID"); fi
          uv run --no-sync rp-core run "${args[@]}"
      # No private scripts, runtime artifacts, public releases, payload echo or cache.
